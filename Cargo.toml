[workspace]
resolver = "2"
members = [
    "crates/tpt-archon-core",
    "crates/tpt-archon-bridge",
    "crates/tpt-archon-kernel",
    "crates/tpt-archon-relational",
    "crates/out-archon-sql",
    "crates/out-archon-wasm",
]
# Benchmarks live in their own crate so Criterion is only built when explicitly
# running `cargo bench` from `benches/`, keeping the main workspace lean.
#
# Crate naming convention: crates published to crates.io are prefixed
# `tpt-archon-`; crates that are never published (dev/demo tools, the
# verification harness) are prefixed `out-archon-` instead, so publish intent
# is visible from the name/directory alone, not just a `publish = false` line
# buried in Cargo.toml.
#
# `out-archon-verify` is intentionally NOT a default workspace member: it
# pulls git-hosted ecosystem verifiers (`tpt-eidos-verifier`, `tpt-telos-*`,
# `tpt-gpu-ir-spec`). If it stayed a member, `cargo test --workspace` would
# require network access to those git repos on every fresh CI run, breaking the
# offline-clean adoption story. It is built/tested by an opt-in job in
# `.github/workflows/ci.yml` (the `verify` job), which has network access.
# `cargo publish -p tpt-archon-core --dry-run` stays clean because the
# verifier git deps never enter a shippable crate. See ADR 0003.
#
# `crates/out-archon-wasm` (the wasm-bindgen browser playground for
# `tpt-archon-relational`) stays a normal member, unlike `out-archon-verify`
# above: it needs no network to build, and `wasm-bindgen`/its `cdylib` crate
# type compile fine on the default host target too (they just don't produce
# anything a browser can use there) — see that crate's README for the actual
# `wasm32-unknown-unknown` + `wasm-pack` build.
#
# `crates/out-archon-py` (PyO3 Python bindings) is excluded for a different
# but analogous reason to `out-archon-verify`: it's a `cdylib`
# `extension-module` crate, and building one for real means linking against a
# Python interpreter, normally driven through `maturin`/`pip` — neither of
# which is present on a bare `cargo build --workspace` / `cargo test
# --workspace` runner. Leaving it a member would break the offline-clean gate
# above for anyone without Python tooling installed. It gets its own CI job
# instead (`.github/workflows/python.yml`) that installs `maturin` first.
#
# `crates/out-archon-node` (napi-rs Node.js bindings, publishes to npm not
# crates.io) is excluded for a related but distinct reason: it builds a
# `cdylib` that the `napi` CLI (see `crates/out-archon-node/package.json`)
# expects to drive itself -- invoking `cargo build` with its own
# platform-target flags and post-processing the resulting library into a
# loadable `.node` file. Left as a workspace member, a bare
# `cargo build --workspace` / `cargo test --workspace` would try to build
# that `cdylib` directly with none of that post-processing, on every
# contributor's machine regardless of whether Node.js is even installed --
# breaking the offline-clean adoption story the same way a network-requiring
# member would. It has its own opt-in job in `.github/workflows/node.yml`
# (installs Node, runs `napi build`, runs a JS smoke test) instead.
exclude = [
    "benches",
    "crates/out-archon-verify",
    "crates/out-archon-py",
    "crates/out-archon-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-archon"
homepage = "https://github.com/tpt-solutions/tpt-archon"
# No shared `keywords`/`categories` here: each published crate does something
# different enough on crates.io (storage engine vs. IPC glue vs. microkernel
# vs. SQL engine) that a blanket workspace-wide list would be generic to the
# point of being wrong for at least three of the four. Each crate's own
# Cargo.toml sets its own.

[profile.release]
opt-level = 3
