[package]
name = "out-archon-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Verification harness for tpt-archon: eidos structural invariants, telos formal proofs, and GPU IR emission smoke tests"

# Not published: an internal verification harness, not one of the layered
# architecture crates (see CLAUDE.md/AGENTS.md). Package name carries the
# `out-archon-` not-published-crate prefix per the workspace's publish/
# no-publish naming convention, same as `out-archon-sql`.
#
# A normal workspace member as of 2026-08-04: it previously depended on
# git-hosted ecosystem verifiers and was excluded from the workspace/its own
# CI job for that reason (crates.io rejects git deps, and fetching them
# needed network beyond the standard registry). All of `tpt-eidos-verifier`,
# `tpt-telos-verifier`/`tpt-telos-ir`/`tpt-telos-parser`, and `tpt-gpu-ir-spec`
# are now published to crates.io, so those constraints no longer apply — see
# TODO.md Phase 9.

[dependencies]
tpt-archon-core = { path = "../tpt-archon-core", default-features = false }

tpt-eidos-verifier = "0.2.0"
tpt-telos-verifier = "0.1.1"
tpt-telos-ir = "0.1.1"
tpt-telos-parser = "0.1.1"
tpt-gpu-ir-spec = "0.1.0"

[dev-dependencies]
tpt-archon-relational = { path = "../tpt-archon-relational", default-features = false, features = ["std"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
