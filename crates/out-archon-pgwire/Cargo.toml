[package]
name = "out-archon-pgwire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

description = "PostgreSQL wire-protocol server for tpt-archon (non-published, demo/verification)"

[features]
default = ["std"]
std = []

[dependencies]
tpt-archon-relational = { path = "../tpt-archon-relational", version = "0.1.0", features = ["std"] }
tpt-archon-kernel = { path = "../tpt-archon-kernel", version = "0.1.0" }
thiserror = "1.0"
rand = "0.8"
bytes = "1.0"

[dev-dependencies]

[[bin]]
name = "archon-pgwire"
path = "src/bin/archon-pgwire.rs"
