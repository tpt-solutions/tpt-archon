[package]
name = "out-archon-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "wasm-bindgen glue + browser playground for the TPT Archon SQL engine"
publish = false

# Not published: a dev/demo tool, not one of the layered architecture crates
# (see CLAUDE.md). Package name carries the `out-archon-` prefix per the
# workspace's publish/no-publish naming convention. `cdylib` is what
# `wasm-pack`/`wasm-bindgen-cli` need to emit the `.wasm` + JS glue for
# `www/`; `rlib` is kept alongside it so `cargo test --workspace` (which
# needs a linkable test harness, not a cdylib) still works on a normal host
# target — `wasm-bindgen` itself compiles fine off-target, it just doesn't
# generate anything useful there. See `crates/out-archon-wasm/README.md` for
# how to actually build the wasm package.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# On by default so a plain `wasm-pack build` gives real panic messages in the
# browser console instead of an opaque "unreachable executed" trap; kept
# optional (rather than a hard dependency) since it pulls in `std::panic`
# hook plumbing that a non-browser consumer of this crate wouldn't need.
default = ["console_error_panic_hook"]

[dependencies]
# `default-features = false` matches the exact configuration CI's `wasm` job
# (`.github/workflows/ci.yml`) already proves compiles for
# wasm32-unknown-unknown (`cargo check -p tpt-archon-relational
# --no-default-features --target wasm32-unknown-unknown`) — the `std`
# feature pulls in OS-specific code paths (file-backed storage, threads) in
# `tpt-archon-core`/`-bridge`/`-kernel` that aren't meant to run on wasm32.
# `Database` itself only needs `alloc`, which this configuration still has.
tpt-archon-relational = { path = "../tpt-archon-relational", version = "0.1.0", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }
