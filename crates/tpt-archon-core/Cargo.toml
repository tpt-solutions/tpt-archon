[package]
name = "tpt-archon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-archon-core"
keywords = ["storage-engine", "b-tree", "wal", "no-std", "embedded"]
categories = ["database-implementations", "no-std", "data-structures", "filesystem"]
description = "no_std, zero-allocation storage engine: block device, page manager, WAL, B-Link tree"

[features]
default = ["std"]
std = []
# Real OS-level memory-mapped, zero-copy *read* access (`MmapBlockDevice`).
# Off by default: a new OS-integration surface should be adopted explicitly,
# not force a new transitive dependency onto every existing `std` consumer.
# Unlike a Linux-only backend, `memmap2` is genuinely cross-platform (mmap(2)
# on Unix, CreateFileMappingW on Windows), so this needs no target gating and
# is exercised on every OS in CI, not just Linux.
mmap = ["std", "dep:memmap2"]
# Writable (msync-ordered) mmap block device. A *separate* feature from read-
# only `mmap` so existing read-only consumers are never silently handed write
# capability. Implies `mmap` (which implies `std`). Deliberately core-crate-
# only: not wired into the bridge/kernel zero-copy cache (see TODO.md Phase
# 11.3) — `StorageEngine`'s write-ahead invariant stays enforced by the two-
# operation ordering in `crate::storage`, untouched.
mmap-write = ["mmap"]

[dependencies]
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
