name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build & test (shippable crates, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # `out-archon-verify` is excluded from the default workspace, so this
        # gate needs no network and stays green on a fresh/offline checkout.
        run: cargo test --workspace
      - name: Build tpt-archon-core (no_std, default features off)
        run: cargo build -p tpt-archon-core --no-default-features
      # Only tpt-archon-core has zero internal workspace (path) dependencies, so it's
      # the one crate `cargo publish --dry-run` can check pre-release: every other
      # crate depends on sibling crates via path, and cargo needs to resolve those
      # path-deps' `version` against the *real* crates.io index, which only succeeds
      # once those sibling crates are actually published there (see release.yml).
      - name: Verify crates.io packaging (dry run)
        run: cargo publish -p tpt-archon-core --dry-run --allow-dirty

  verify:
    name: Formal-verification harness (opt-in, network)
    runs-on: ubuntu-latest
    # This job fetches git-hosted ecosystem verifiers, so it needs network and
    # runs separately from the offline shippable-crate gate above.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format (verify crate)
        run: cargo fmt -p out-archon-verify -- --check
      - name: Test verification harness
        run: cargo test -p out-archon-verify
        working-directory: crates/out-archon-verify
      - name: Supply-chain audit (verify harness's git deps)
        # The root `deny` job never sees this crate — it's excluded from the
        # default workspace, so its git deps on the ecosystem verifiers were
        # otherwise unscanned. Runs here since resolving them needs network.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/out-archon-verify/Cargo.toml
          config: crates/out-archon-verify/deny.toml

  deny:
    name: Supply-chain audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV compatibility (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace with MSRV
        run: cargo check --workspace
      - name: Build core no_std with MSRV
        run: cargo check -p tpt-archon-core --no-default-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  no-std:
    name: no_std embedded target (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build core for embedded target
        run: cargo build -p tpt-archon-core --no-default-features --target thumbv7em-none-eabihf

  wasm:
    name: WASM build (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build full stack for WASM
        run: cargo check -p tpt-archon-relational --no-default-features --target wasm32-unknown-unknown

  io-uring:
    name: io_uring backend (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (io-uring-backend feature)
        run: cargo clippy -p tpt-archon-kernel --features io-uring-backend --all-targets -- -D warnings
      - name: Test io_uring reactor
        # Needs a real Linux kernel with io_uring enabled — ubuntu-latest
        # runners support it. Not part of the offline `test` job since it's
        # not a `default` feature (see the crate's Cargo.toml comment).
        run: cargo test -p tpt-archon-kernel --features io-uring-backend

  mmap:
    name: mmap zero-copy read path (cross-platform)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (mmap feature)
        run: cargo clippy --workspace --features mmap --all-targets -- -D warnings
      - name: Test mmap zero-copy read path
        # Not part of the offline `test` job since `mmap` isn't a `default`
        # feature — but unlike `io-uring-backend`, `memmap2` is genuinely
        # cross-platform, so this runs (and is verified) on both Linux and
        # Windows, not just Linux.
        run: cargo test --workspace --features mmap

