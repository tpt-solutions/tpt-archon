name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build & test (shippable crates, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # `out-archon-verify` is excluded from the default workspace, so this
        # gate needs no network and stays green on a fresh/offline checkout.
        run: cargo test --workspace
      - name: Build tpt-archon-core (no_std, default features off)
        run: cargo build -p tpt-archon-core --no-default-features
      # Only tpt-archon-core has zero internal workspace (path) dependencies, so it's
      # the one crate `cargo publish --dry-run` can check pre-release: every other
      # crate depends on sibling crates via path, and cargo needs to resolve those
      # path-deps' `version` against the *real* crates.io index, which only succeeds
      # once those sibling crates are actually published there (see release.yml).
      - name: Verify crates.io packaging (dry run)
        run: cargo publish -p tpt-archon-core --dry-run --allow-dirty

  verify:
    name: Formal-verification harness (opt-in, network)
    runs-on: ubuntu-latest
    # This job fetches git-hosted ecosystem verifiers, so it needs network and
    # runs separately from the offline shippable-crate gate above.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format (verify crate)
        run: cargo fmt -p out-archon-verify -- --check
      - name: Test verification harness
        run: cargo test -p out-archon-verify
        working-directory: crates/out-archon-verify

  deny:
    name: Supply-chain audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV compatibility (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace with MSRV
        run: cargo check --workspace
      - name: Build core no_std with MSRV
        run: cargo check -p tpt-archon-core --no-default-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  no-std:
    name: no_std embedded target (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build core for embedded target
        run: cargo build -p tpt-archon-core --no-default-features --target thumbv7em-none-eabihf

  wasm:
    name: WASM build (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build full stack for WASM
        run: cargo check -p tpt-archon-relational --no-default-features --target wasm32-unknown-unknown

