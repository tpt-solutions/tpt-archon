name: Docker publish

# Auto-publishes on a `v*` tag push (e.g. `v0.1.0`) so a pre-built image is
# available the moment a release is cut, without changing the manual-only
# convention for crates.io publishing in release.yml/CLAUDE.md — this is the
# demo/adoption image (archon-sql REPL), not a crates.io package, so it's held
# to a looser bar. `workflow_dispatch` is kept for building/trying an
# untagged or ad hoc image without cutting a release.
#
# Pushes to GHCR using the built-in GITHUB_TOKEN, so no extra registry
# secret is required.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. a version like 0.1.0, or 'latest')"
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/archon-sql

jobs:
  build-and-push:
    name: Build & push archon-sql image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
