name: Docker publish

# Manual-dispatch only, matching the "publishing is manual" convention in
# release.yml/CLAUDE.md — nothing auto-publishes on tag/push. Builds the
# root Dockerfile (archon-sql REPL) and pushes to GHCR using the built-in
# GITHUB_TOKEN, so no extra registry secret is required.
#
# Trigger by hand from the Actions tab once a build is ready to be tried
# without a local `docker build`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. a version like 0.1.0, or 'latest')"
        required: true
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/archon-sql

jobs:
  build-and-push:
    name: Build & push archon-sql image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
